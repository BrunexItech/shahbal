[modules]
autoload = yes

; the old channel driver — pjsip replaces it, and loading both fights over 5060
noload => chan_sip.so

; HEP/Homer capture — not used
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so

; realtime config backends we don't use (they error out looking for a DB/LDAP)
noload => res_config_pgsql.so
noload => res_config_ldap.so
noload => res_config_odbc.so
noload => res_config_curl.so

; hardware / legacy channel drivers with nothing to talk to in a container
noload => chan_alsa.so
noload => chan_console.so
noload => chan_mgcp.so
noload => chan_skinny.so
noload => chan_unistim.so
noload => chan_dahdi.so

; other unused subsystems that only add noise on boot
noload => pbx_dundi.so
noload => res_geolocation.so
noload => app_geolocation.so
noload => res_pjsip_geolocation.so

; Ubuntu ships three voicemail modules that all try to register VM_INFO —
; keep plain app_voicemail, drop the IMAP/ODBC-backed ones.
noload => app_voicemail_imap.so
noload => app_voicemail_odbc.so

; CDR/CEL backends that need a database we don't have
noload => cdr_pgsql.so
noload => cdr_tds.so
noload => cdr_radius.so
noload => cdr_odbc.so
noload => cel_pgsql.so
noload => cel_tds.so
noload => cel_radius.so
noload => cel_odbc.so
noload => cel_sqlite3_custom.so
noload => cdr_sqlite3_custom.so
