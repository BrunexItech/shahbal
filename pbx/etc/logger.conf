[general]
dateformat = %F %T

[logfiles]
; systemd journal / `journalctl -u asterisk` gets the notices
console => notice,warning,error,verbose(3)
messages => notice,warning,error
; /var/log/asterisk/full — full detail, incl. the DTLS / ICE / SRTP lines and
; dialplan execution traces (Dial(), Executing[...], pjsip set logger output)
; needed to debug calls. A bare "verbose" with no level is verbose(0) — it
; silently drops exactly the call-trace lines debugging needs, even though
; the channel shows as "Enabled". Rotated by /etc/logrotate.d/asterisk.
full => notice,warning,error,debug,verbose(5)
