# Full stack on one origin (http://localhost:8090 → put TLS in front in production).
#   docker compose up -d --build
# Secrets come from backend/.env (see backend/.env.example); never commit it.
# Deployment knobs come from ./.env next to this file (see .env.example): PUBLIC_ORIGIN,
# GATEWAY_PORT, TRUSTED_PROXIES, POSTGRES_PASSWORD.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shahbal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shahbal}
      POSTGRES_DB: shahbal
    ports:
      - "127.0.0.1:5436:5432"   # loopback only: never expose the database
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shahbal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://shahbal:${POSTGRES_PASSWORD:-shahbal}@postgres:5432/shahbal
      CORS_ORIGINS: '["${PUBLIC_ORIGIN:-http://localhost:8090}"]'
      # Proxies in front of the API that append to X-Forwarded-For: 1 = this gateway only.
      # Behind host nginx + Cloudflare it is 3 (see deploy/DEPLOY.md).
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-1}"
      RECORDINGS_DIR: /data/recordings
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - recordings:/data/recordings   # encrypted call recordings
      - photos:/data/photos           # encrypted staff photos
      - visit-photos:/data/visit-photos   # encrypted visit photos
      - issue-photos:/data/issue-photos   # encrypted Community Voice photos
      - result-forms:/data/result-forms   # encrypted Form 34A photos
      - site-media:/data/site-media       # public website photos and videos
    command: sh -c "alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  worker:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://shahbal:${POSTGRES_PASSWORD:-shahbal}@postgres:5432/shahbal
      RECORDINGS_DIR: /data/recordings
    depends_on:
      - backend
    volumes:
      - recordings:/data/recordings   # the worker purges expired recordings
    command: python -m app.worker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1        # same origin via the gateway
        NEXT_PUBLIC_GIS_URL: /gis/
        NEXT_PUBLIC_MAPILLARY_TOKEN: ${MAPILLARY_TOKEN:-}   # street-level photos in GIS Lab
    depends_on:
      - backend
    restart: unless-stopped

  # GeoLibre (MIT, opengeos) built from a pinned release with the /gis/ base path.
  gislab:
    build:
      context: https://github.com/opengeos/GeoLibre.git#v3.0.0
      args:
        GEOLIBRE_APP_BASE: /gis/
        VITE_WELCOME_DISABLED: "1"
    environment:
      GEOLIBRE_SHARE_URL: "off"          # no publishing to share.geolibre.app, ever
      GEOLIBRE_GEOLENS_URL: "off"
      GEOLIBRE_DISABLE_SIDECAR: "1"      # browser-only: no server-side file/DB access
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
      - gislab
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8090}:80"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # ---- Call centre phone exchange (Cloud One) — off until you start it: ----
  #   docker-compose --profile pbx up -d --build pbx turn
  # Keys live in backend/.env (CLOUDONE_*, PBX_*, TURN_*). Host networking: SIP, RTP
  # and TURN bind straight to the server so call audio isn't mangled by Docker NAT.
  pbx:
    build: ./pbx
    profiles: ["pbx"]
    network_mode: host
    env_file:
      - path: ./backend/.env
        required: false
    restart: unless-stopped

  turn:
    image: coturn/coturn:4.6
    profiles: ["pbx"]
    network_mode: host
    env_file:
      - path: ./backend/.env
        required: false
    # Relay-only media for the browser softphones, bound to the public IP only and
    # allowed to reach nothing but this server's own PBX.
    entrypoint: ["sh", "-c", "exec turnserver -n --listening-ip=$$PBX_PUBLIC_IP --relay-ip=$$PBX_PUBLIC_IP --external-ip=$$PBX_PUBLIC_IP --listening-port=$${TURN_PORT:-3479} --min-port=$${TURN_MIN_PORT:-49300} --max-port=$${TURN_MAX_PORT:-49399} --realm=shahbal --lt-cred-mech --user=$$TURN_USERNAME:$$TURN_PASSWORD --no-tls --no-dtls --no-cli --no-multicast-peers --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255 --denied-peer-ip=192.168.0.0-192.168.255.255 --allowed-peer-ip=$$PBX_PUBLIC_IP"]
    restart: unless-stopped

volumes:
  pgdata:
  recordings:
  photos:
  visit-photos:
  issue-photos:
  result-forms:
  site-media:
