# Single public origin for the whole platform:
#   /        → Next.js app          /api/  → FastAPI
#   /gis/    → GeoLibre GIS Lab (HQ admins only, via auth_request)
# One origin means the session cookie (httpOnly, SameSite=Strict) covers
# everything, with no CORS and no tokens in URLs. TLS terminates in front of this
# (host nginx / Cloudflare), which must forward X-Forwarded-Proto.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Rate-limit per visitor, not per proxy: behind Cloudflare + host nginx every request
# arrives from the same address, so key on Cloudflare's client IP when present.
map $http_cf_connecting_ip $client_key { "" $binary_remote_addr; default $http_cf_connecting_ip; }

limit_req_zone $client_key zone=auth:10m rate=10r/m;
limit_req_zone $client_key zone=portal:10m rate=20r/m;
limit_req_zone $client_key zone=api:20m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 60m;   # visit photos (12 MB) and call recordings (50 MB)

    # Look services up through Docker's DNS on every request (cached 10 s), not once at
    # start-up: rebuilt containers get new addresses, and a stale one means 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $be backend:8000;
    set $fe frontend:3000;
    set $gis gislab:80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # ---- API ------------------------------------------------------------------
    location = /api/v1/auth/login { limit_req zone=auth burst=5 nodelay; proxy_pass http://$be; }
    location = /api/v1/auth/mfa   { limit_req zone=auth burst=5 nodelay; proxy_pass http://$be; }
    # Public sign-up: only the submission is strictly limited (the API adds an hourly cap);
    # the page's read-only lookups and the QR image use the normal API allowance.
    location = /api/v1/portal/signup { limit_req zone=portal burst=10 nodelay; proxy_pass http://$be; }
    location /api/v1/portal/         { limit_req zone=api burst=60 nodelay; proxy_pass http://$be; }
    # Live pulse (Server-Sent Events): stream straight through, no buffering.
    location = /api/v1/live/stream {
        proxy_pass http://$be;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location /api/                { limit_req zone=api burst=60 nodelay; proxy_pass http://$be; }
    location = /health            { proxy_pass http://$be; }

    # ---- GIS Lab (GeoLibre, built with base path /gis/) ------------------------
    location = /_gis_auth {
        internal;
        proxy_pass http://$be/api/v1/auth/gis-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location = /gis { return 301 /gis/; }
    location /gis/ {
        auth_request /_gis_auth;
        error_page 401 403 = @gis_denied;
        rewrite ^/gis/(.*)$ /$1 break;   # strip the /gis prefix (a variable proxy_pass can't)
        proxy_pass http://$gis;

        # GeoLibre's stock CSP allows http://localhost:* for local development;
        # replace it with the same policy minus loopback, as its docs advise.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: data: blob:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' blob: 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net/npm/ https://cdn.jsdelivr.net/pyodide/; worker-src blob: 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location @gis_denied { return 302 /command/login?next=/gis-lab; }

    # ---- App ------------------------------------------------------------------
    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://$fe;
    }
}
